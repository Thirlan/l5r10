<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Map Builder</title>
  <link rel="stylesheet" href="../css/navbar.css" />
  <link rel="stylesheet" href="../css/general.css" />
  <link rel="stylesheet" href="../css/world-map-grid.css" />
</head>
<body>
  <header>
    <nav class="navbar"></nav>
  </header>

  <main>
    <h1>Map Builder</h1>

    <div class="zoom-controls">
      <button type="button" onclick="mapGrid.zoomOut()">− Zoom Out</button>
      <span id="zoomLevel">100%</span>
      <button type="button" onclick="mapGrid.zoomIn()">+ Zoom In</button>
      <button type="button" onclick="mapGrid.resetZoom()">100%</button>
      <button type="button" onclick="mapGrid.fitToWidth()">Fit Width</button>
      <span class="hint">Ctrl + mouse wheel to zoom · right-click a cell to erase it on the active layer</span>
    </div>

    <div class="map-grid-container">
      <canvas id="mapCanvas" data-map-src="../img/map/rokugan_900_small.png" data-grid-size="16"></canvas>
    </div>

    <div class="map-controls">
      <!-- Terrain Layer -->
      <div class="control-panel">
        <h3>Terrain Layer</h3>
        <button class="tool-button" onclick="mapGrid.selectTool('terrain', 'Mountain', 'terrain'); updateActiveButton(this); mapGrid.currentLayer='terrain';">
          <span class="terrain-color" style="background-color: #8B7355;"></span>Mountain
        </button>
        <button class="tool-button" onclick="mapGrid.selectTool('terrain', 'Ocean', 'terrain'); updateActiveButton(this); mapGrid.currentLayer='terrain';">
          <span class="terrain-color" style="background-color: #4169E1;"></span>Ocean
        </button>
        <button class="tool-button" onclick="mapGrid.selectTool('terrain', 'Water', 'terrain'); updateActiveButton(this); mapGrid.currentLayer='terrain';">
          <span class="terrain-color" style="background-color: #1E90FF;"></span>Water
        </button>
        <button class="tool-button" onclick="mapGrid.selectTool('terrain', 'Forest', 'terrain'); updateActiveButton(this); mapGrid.currentLayer='terrain';">
          <span class="terrain-color" style="background-color: #228B22;"></span>Forest
        </button>
        <button class="tool-button" onclick="mapGrid.selectTool('terrain', 'Plains', 'terrain'); updateActiveButton(this); mapGrid.currentLayer='terrain';">
          <span class="terrain-color" style="background-color: #90EE90;"></span>Plains
        </button>
        <button class="tool-button" onclick="mapGrid.selectTool('terrain', 'Hills', 'terrain'); updateActiveButton(this); mapGrid.currentLayer='terrain';">
          <span class="terrain-color" style="background-color: #DAA520;"></span>Hills
        </button>
        <button class="tool-button" onclick="mapGrid.selectTool('terrain', 'Deserts', 'terrain'); updateActiveButton(this); mapGrid.currentLayer='terrain';">
          <span class="terrain-color" style="background-color: #F4A460;"></span>Deserts
        </button>
        <button class="tool-button" onclick="mapGrid.selectTool('terrain', 'Marsh', 'terrain'); updateActiveButton(this); mapGrid.currentLayer='terrain';">
          <span class="terrain-color" style="background-color: #556B2F;"></span>Marsh
        </button>
        <button class="tool-button" onclick="mapGrid.selectTool('terrain', 'Deep Ocean', 'terrain'); updateActiveButton(this); mapGrid.currentLayer='terrain';">
          <span class="terrain-color" style="background-color: #00008B;"></span>Deep Ocean
        </button>
        <button class="tool-button" onclick="mapGrid.selectTool('terrain', 'Snow', 'terrain'); updateActiveButton(this); mapGrid.currentLayer='terrain';">
          <span class="terrain-color" style="background-color: #F0F8FF;"></span>Snow
        </button>
        <button class="tool-button" onclick="mapGrid.selectTool('terrain', 'City', 'terrain'); updateActiveButton(this); mapGrid.currentLayer='terrain';">
          <span class="terrain-color" style="background-color: #FF6347;"></span>City
        </button>
        <button class="tool-button erase-button" onclick="mapGrid.selectTool('erase', 'terrain', 'erase'); updateActiveButton(this);">
          Erase Terrain
        </button>
      </div>

      <!-- Clan Layer -->
      <div class="control-panel">
        <h3>Clan Layer</h3>
        <button class="tool-button" onclick="mapGrid.selectTool('clan', 'Crane', 'clans'); updateActiveButton(this); mapGrid.currentLayer='clans';">
          <span class="terrain-color" style="background-color: #FFFFFF; border-color: #87CEEB;"></span>Crane
        </button>
        <button class="tool-button" onclick="mapGrid.selectTool('clan', 'Lion', 'clans'); updateActiveButton(this); mapGrid.currentLayer='clans';">
          <span class="terrain-color" style="background-color: #D4A017; border-color: #8B4513;"></span>Lion
        </button>
        <button class="tool-button" onclick="mapGrid.selectTool('clan', 'Crab', 'clans'); updateActiveButton(this); mapGrid.currentLayer='clans';">
          <span class="terrain-color" style="background-color: #808080; border-color: #00008B;"></span>Crab
        </button>
        <button class="tool-button" onclick="mapGrid.selectTool('clan', 'Dragon', 'clans'); updateActiveButton(this); mapGrid.currentLayer='clans';">
          <span class="terrain-color" style="background-color: #FFFF00; border-color: #228B22;"></span>Dragon
        </button>
        <button class="tool-button" onclick="mapGrid.selectTool('clan', 'Unicorn', 'clans'); updateActiveButton(this); mapGrid.currentLayer='clans';">
          <span class="terrain-color" style="background-color: #FFFF00; border-color: #800080;"></span>Unicorn
        </button>
        <button class="tool-button" onclick="mapGrid.selectTool('clan', 'Scorpion', 'clans'); updateActiveButton(this); mapGrid.currentLayer='clans';">
          <span class="terrain-color" style="background-color: #000000; border-color: #FF0000;"></span>Scorpion
        </button>
        <button class="tool-button" onclick="mapGrid.selectTool('clan', 'Imperial', 'clans'); updateActiveButton(this); mapGrid.currentLayer='clans';">
          <span class="terrain-color" style="background-color: #FFFFFF; border-color: #D4AF37;"></span>Imperial
        </button>
        <button class="tool-button" onclick="mapGrid.selectTool('clan', 'Shadowlands', 'clans'); updateActiveButton(this); mapGrid.currentLayer='clans';">
          <span class="terrain-color" style="background-color: #000000;"></span>Shadowlands
        </button>
        <button class="tool-button" onclick="mapGrid.selectTool('clan', 'Phoenix', 'clans'); updateActiveButton(this); mapGrid.currentLayer='clans';">
          <span class="terrain-color" style="background-color: #FFA500; border-color: #FFD700;"></span>Phoenix
        </button>
        <button class="tool-button" onclick="mapGrid.selectTool('clan', 'Mantis', 'clans'); updateActiveButton(this); mapGrid.currentLayer='clans';">
          <span class="terrain-color" style="background-color: #006400;"></span>Mantis
        </button>
        <button class="tool-button" onclick="mapGrid.selectTool('clan', 'Hare', 'clans'); updateActiveButton(this); mapGrid.currentLayer='clans';">
          <span class="terrain-color" style="background-color: #FFFFFF; border-color: #FF0000;"></span>Hare
        </button>
        <button class="tool-button" onclick="mapGrid.selectTool('clan', 'Centipede', 'clans'); updateActiveButton(this); mapGrid.currentLayer='clans';">
          <span class="terrain-color" style="background-color: #8B4513; border-color: #FFA500;"></span>Centipede
        </button>
        <button class="tool-button" onclick="mapGrid.selectTool('clan', 'Fox', 'clans'); updateActiveButton(this); mapGrid.currentLayer='clans';">
          <span class="terrain-color" style="background-color: #808080; border-color: #C4A484;"></span>Fox
        </button>
        <button class="tool-button" onclick="mapGrid.selectTool('clan', 'Badger', 'clans'); updateActiveButton(this); mapGrid.currentLayer='clans';">
          <span class="terrain-color" style="background-color: #000000; border-color: #808080;"></span>Badger
        </button>
        <button class="tool-button" onclick="mapGrid.selectTool('clan', 'Dragonfly', 'clans'); updateActiveButton(this); mapGrid.currentLayer='clans';">
          <span class="terrain-color" style="background-color: #FFFF00; border-color: #00008B;"></span>Dragonfly
        </button>
        <button class="tool-button" onclick="mapGrid.selectTool('clan', 'Falcon', 'clans'); updateActiveButton(this); mapGrid.currentLayer='clans';">
          <span class="terrain-color" style="background-color: #808080; border-color: #228B22;"></span>Falcon
        </button>
        <button class="tool-button" onclick="mapGrid.selectTool('clan', 'Sparrow', 'clans'); updateActiveButton(this); mapGrid.currentLayer='clans';">
          <span class="terrain-color" style="background-color: #000000; border-color: #F0E68C;"></span>Sparrow
        </button>
        <button class="tool-button" onclick="mapGrid.selectTool('clan', 'Tortoise', 'clans'); updateActiveButton(this); mapGrid.currentLayer='clans';">
          <span class="terrain-color" style="background-color: #FFFF00; border-color: #000033;"></span>Tortoise
        </button>
        <button class="tool-button erase-button" onclick="mapGrid.selectTool('erase', 'clans', 'erase'); updateActiveButton(this);">
          Erase Clan
        </button>
      </div>

      <!-- Infrastructure Layer -->
      <div class="control-panel">
        <h3>Infrastructure Layer</h3>
        <button class="tool-button" onclick="mapGrid.selectTool('road', 'Road', 'infrastructure'); updateActiveButton(this);">
          <span class="terrain-color" style="background-color: #f1b17d;"></span>Road
        </button>
        <button class="tool-button erase-button" onclick="mapGrid.selectTool('erase', 'infrastructure', 'erase'); updateActiveButton(this);">
          Erase Road
        </button>

        <h3 style="margin-top: 20px;">Erase</h3>
        <button class="tool-button erase-button" onclick="mapGrid.selectTool('erase', null, 'erase'); updateActiveButton(this);">
          Erase Tile (all layers)
        </button>

        <h3 style="margin-top: 20px;">Brush Size</h3>
        <div class="control-section">
          <label for="brushSize">Tiles painted per click:</label>
          <select id="brushSize" onchange="mapGrid.setBrushSize(this.value)">
            <option value="1">1 x 1</option>
            <option value="2">2 x 2</option>
            <option value="3">3 x 3</option>
            <option value="4">4 x 4</option>
            <option value="5">5 x 5</option>
            <option value="6">6 x 6</option>
            <option value="7">7 x 7</option>
            <option value="8">8 x 8</option>
          </select>
        </div>
      </div>

      <!-- Settlement Layer -->
      <div class="control-panel">
        <h3>Settlement Layer</h3>
        <button class="tool-button" onclick="mapGrid.selectTool('settlement', 'Village', 'settlements'); updateActiveButton(this);"><span class="settlement-icon settlement-village"></span>Village</button>
        <button class="tool-button" onclick="mapGrid.selectTool('settlement', 'City', 'settlements'); updateActiveButton(this);"><span class="settlement-icon settlement-city"></span>City</button>
        <button class="tool-button" onclick="mapGrid.selectTool('settlement', 'Capital', 'settlements'); updateActiveButton(this);"><span class="settlement-icon settlement-capital"></span>Capital</button>
        <button class="tool-button" onclick="mapGrid.selectTool('settlement', 'Fortification', 'settlements'); updateActiveButton(this);"><span class="settlement-icon settlement-fortification"></span>Fortification</button>
        <button class="tool-button" onclick="mapGrid.selectTool('settlement', 'Castle', 'settlements'); updateActiveButton(this);"><span class="settlement-icon settlement-castle"></span>Castle</button>
        <button class="tool-button" onclick="mapGrid.selectTool('settlement', 'Kyuden', 'settlements'); updateActiveButton(this);"><span class="settlement-icon settlement-kyuden"></span>Kyuden</button>
        <button class="tool-button" onclick="mapGrid.selectTool('settlement', 'Mine', 'settlements'); updateActiveButton(this);"><span class="settlement-icon settlement-mine"></span>Mine</button>
        <button class="tool-button" onclick="mapGrid.selectTool('settlement', 'Lumber Mill', 'settlements'); updateActiveButton(this);"><span class="settlement-icon settlement-lumber-mill"></span>Lumber Mill</button>
        <button class="tool-button" onclick="mapGrid.selectTool('settlement', 'Farm', 'settlements'); updateActiveButton(this);"><span class="settlement-icon settlement-farm"></span>Farm</button>
        <div class="control-section" style="margin-top: 15px;">
          <label for="settlementEnglishName">English Name</label>
          <input type="text" id="settlementEnglishName">
        </div>
        <div class="control-section">
          <label for="settlementRokuganiName">Rokugani Name</label>
          <input type="text" id="settlementRokuganiName">
        </div>
        <div class="control-section">
          <label>Display Names</label>
          <label><input type="radio" name="settlementLanguage" value="english" checked onchange="mapGrid.setSettlementLanguage(this.value)"> English</label>
          <label><input type="radio" name="settlementLanguage" value="rokugani" onchange="mapGrid.setSettlementLanguage(this.value)"> Rokugani</label>
        </div>
        <button class="tool-button erase-button" onclick="mapGrid.selectTool('erase', 'settlements', 'erase'); updateActiveButton(this);">Erase Settlement</button>
      </div>

      <!-- Text Layer & File Operations -->
      <div class="control-panel">
        <h3>Text Layer</h3>
        <div class="control-section">
          <label for="fontSize">Font Size:</label>
          <input type="number" id="fontSize" min="8" max="48" value="16" onchange="mapGrid.setFontSize(this.value)">
        </div>
        <button class="tool-button" onclick="mapGrid.selectTool('text', null, 'text'); updateActiveButton(this); mapGrid.currentLayer='text';">
          Add Text
        </button>
        <button class="tool-button erase-button" onclick="mapGrid.selectTool('erase', 'text', 'erase'); updateActiveButton(this);">
          Erase Text
        </button>

        <h3 style="margin-top: 20px;">File Operations</h3>
        <div class="action-buttons">
          <button class="save-btn" onclick="mapGrid.exportToFile();">Save Map</button>
          <button class="load-btn" onclick="document.getElementById('fileInput').click();">Load Map</button>
          <button class="clear-btn" onclick="mapGrid.clearAllLayers();">Clear All</button>
        </div>
        <input type="file" id="fileInput" accept=".json" onchange="handleFileSelect(event)">
      </div>
    </div>
  </main>

  <footer>
    <p>Legend of the Five Rings - 10th Century</p>
  </footer>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="../scripts/world-map-grid.js"></script>
  <script>
    $(function() {
      $("nav").load("/l5r10/navbar.html");
    });

    function updateActiveButton(btn) {
      document.querySelectorAll('.tool-button.active').forEach(b => {
        if (b !== btn) b.classList.remove('active');
      });
      btn.classList.add('active');
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (file) {
        mapGrid.importFromFile(file);
      }
    }
  </script>
</body>
</html>
