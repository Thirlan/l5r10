<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate world map controls</title>
  <link rel="stylesheet" href="world-map-controls.css">
</head>
<body>
  <main>
    <h1>Generate world map controls</h1>
    <p>Local development utility. Previews use 32-pixel canvases and zoom 1.</p>
    <p>Download the WebP files. Save them under <code>docs/img/map/</code> without changing their names.</p>
    <p>Blank previews represent None. These downloads contain transparent pixels.</p>
    <p id="status" role="status" aria-live="polite">Loading source images...</p>
    <section id="previews" class="control-previews" aria-label="Control image previews"></section>
  </main>
  <script type="module" src="generate-world-map-controls.js"></script>
</body>
</html>
